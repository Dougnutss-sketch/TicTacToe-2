<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicTacToe</title>
    <link rel="stylesheet" href="tictactoe.css">
    <link rel="shortcut icon" href="gambar/Spider.jpg" type="image/x-icon">
</head>

<body>
    <div class="msg-container hide">
        <p id="msg">You Win</p>
        <button id="new-btn">New Game</button>
    </div>
    <main>
        <h1>Tic Tac Toe</h1>
        <div class="container">
            <div class="game">
                <button class="cell" type="button" cellIndex="0"></button>
                <button class="cell" type="button" cellIndex="1"></button>
                <button class="cell" type="button" cellIndex="2"></button>
                <button class="cell" type="button" cellIndex="3"></button>
                <button class="cell" type="button" cellIndex="4"></button>
                <button class="cell" type="button" cellIndex="5"></button>
                <button class="cell" type="button" cellIndex="6"></button>
                <button class="cell" type="button" cellIndex="7"></button>
                <button class="cell" type="button" cellIndex="8"></button>
            </div>
        </div>
        <button id="reset">Reset Game</button>
    </main>
    <script src="tictactoe.js"></script>
</body>
</html>
